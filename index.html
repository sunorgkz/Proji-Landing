<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proji</title>
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
    </style>
    <script id="proji-prefs-sync">
      (function () {
        try {
          var TK = ["proji.theme", "proji-theme", "proji_theme", "theme", "main-landing-theme", "chrome_extension_theme", "secondbrain-theme"];
          var LK = ["proji.lang", "proji-lang", "proji_lang", "lang", "chrome_extension_lang", "secondbrain-lang"];
          function r(a) {
            for (var i = 0; i < a.length; i++) {
              var v = localStorage.getItem(a[i]);
              if (v) return v;
            }
            return null;
          }
          function w(a, v) {
            for (var i = 0; i < a.length; i++) try { localStorage.setItem(a[i], v); } catch (e) {}
          }
          var t = r(TK) || "dark";
          if (t !== "light" && t !== "dark" && t !== "system") t = "dark";
          w(TK, t);
          var resolved = t === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : t;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var l = r(LK) || "ru";
          w(LK, l);
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";

          var path = location.pathname.replace(/\/+$/, "");
          if (path === "/knowledge") {
            var bg = resolved === "light" ? "#F4F7FC" : "#05070E";
            document.documentElement.style.backgroundColor = bg;
            document.documentElement.dataset.landing = "knowledge";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <script>
      (function () {
        if (document.documentElement.dataset.landing === "knowledge") {
          var resolved = document.documentElement.dataset.theme || "dark";
          var bg = resolved === "light" ? "#F4F7FC" : "#05070E";
          document.body.style.backgroundColor = bg;
          var root = document.getElementById("root");
          if (root) root.style.backgroundColor = bg;
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
