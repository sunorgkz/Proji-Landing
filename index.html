<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Proji: ИИ берёт на себя рутину" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230369a1'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23fff'%3EP%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- знак фонда «Sun» на /sunnet-business: грузим только три буквы -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&text=Sun&display=swap" />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
    </style>
    <script id="proji-prefs-sync">
      (function () {
        try {
          var TK = ["proji.theme", "proji-theme", "proji_theme", "theme", "main-landing-theme", "chrome_extension_theme", "secondbrain-theme"];
          var LK = ["proji.lang", "proji-lang", "proji_lang", "lang", "chrome_extension_lang", "secondbrain-lang"];
          function r(a) {
            for (var i = 0; i < a.length; i++) {
              var v = localStorage.getItem(a[i]);
              if (v) return v;
            }
            return null;
          }
          function w(a, v) {
            for (var i = 0; i < a.length; i++) try { localStorage.setItem(a[i], v); } catch (e) {}
          }
          var t = r(TK) || "dark";
          if (t !== "light" && t !== "dark" && t !== "system") t = "dark";
          w(TK, t);
          var resolved = t === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : t;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var l = r(LK) || "ru";
          w(LK, l);
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";

          var path = location.pathname.replace(/\/+$/, "");
          if (path === "/knowledge") {
            var bg = resolved === "light" ? "#F4F7FC" : "#05070E";
            document.documentElement.style.backgroundColor = bg;
            document.documentElement.dataset.landing = "knowledge";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <script>
      (function () {
        if (document.documentElement.dataset.landing === "knowledge") {
          var resolved = document.documentElement.dataset.theme || "dark";
          var bg = resolved === "light" ? "#F4F7FC" : "#05070E";
          document.body.style.backgroundColor = bg;
          var root = document.getElementById("root");
          if (root) root.style.backgroundColor = bg;
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script src="/cookie-banner.js" defer></script>
  </body>
</html>
